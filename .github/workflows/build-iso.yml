name: Compilar DreamByte OS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl 7zip xorriso squashfs-tools

    - name: Make scripts executable
      run: |
        chmod +x build.sh build-alpine.sh || true

    - name: Build (current Debian path)
      run: |
        sudo ./build.sh || echo "Debian build finished or failed gracefully"

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: DreamByteOS-Installer
        path: |
          DreamByteOS.iso
          *.iso
        if-no-files-found: warn
        retention-days: 7
