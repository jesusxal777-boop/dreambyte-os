name: Compilar DreamByte OS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-alpine:
    runs-on: ubuntu-latest
    name: Build Alpine aarch64 ISO

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq curl p7zip-full xorriso genisoimage

    - name: Make executable
      run: chmod +x build-alpine.sh build.sh || true

    - name: Build DreamByte Alpine aarch64 ISO
      run: sudo ./build-alpine.sh

    - name: Upload ISO
      uses: actions/upload-artifact@v4
      with:
        name: DreamByte-OS-1.0-aarch64
        path: |
          DreamByte-OS-1.0-aarch64.iso
          *.iso
        if-no-files-found: warn
        retention-days: 14

  build-debian-legacy:
    runs-on: ubuntu-latest
    name: Build Debian legacy (optional)
    if: false   # desactivado por defecto

    steps:
    - uses: actions/checkout@v4
    - run: chmod +x build.sh && sudo ./build.sh
    - uses: actions/upload-artifact@v4
      with:
        name: DreamByteOS-Debian
        path: DreamByteOS.iso
        if-no-files-found: warn
